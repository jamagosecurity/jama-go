<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <link rel="icon" type="image/png" href="/JamaGoLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6993d" />
    <title>Jama Go Security — Protecting What Matters Most</title>
    <meta
      name="description"
      content="Jama Go Security delivers professional manned guarding, mobile patrols, event security and 24/7 monitoring for businesses and homes."
    />
    <!--
      Fonts are self-hosted (see scripts/fetch-fonts.mjs). The Google Fonts link
      that used to sit here was render-blocking and cost two extra connections
      before a single glyph could be requested.

      These two are the above-the-fold faces: Sora 800 draws the h1, Inter 400
      the body copy. They are declared font-display: optional, which cannot
      shift the layout but does need the preload to arrive in time to be used —
      measured: dropping these preloads moved First Contentful Paint from 3.6s
      to 4.1s, so they earn their place.
    -->
    <link
      rel="preload"
      href="/fonts/Sora-800-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Inter-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Google Analytics. The connection is opened early so the async script does
      not pay for DNS and TLS when it finally arrives; it is only a hint, so it
      costs nothing if the tag is blocked.

      send_page_view is off on purpose. Angular changes routes without a page
      load, so the tag on its own would record the landing page and nothing
      after it — AnalyticsService reports each navigation instead. That also
      keeps the signed-in portals out of the report: their URLs carry record ids
      and, on an invoice share link, a token in the query string.
    -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-52WG4T69E3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-52WG4T69E3', { send_page_view: false });
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
