<button type="button" class="admin-bell" (click)="togglePanel()"
  [class.is-open]="panelOpen()"
  [attr.aria-expanded]="panelOpen()"
  [attr.aria-label]="unreadCount()
    ? unreadCount() + ' new approval decisions'
    : 'Approval decisions'">
  <span class="admin-bell-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.7 21a2 2 0 0 1-3.4 0" />
    </svg>
  </span>
  <span class="admin-bell-label">Approvals</span>
  @if (unreadCount() > 0) {
    <span class="admin-bell-count">{{ unreadCount() > 99 ? '99+' : unreadCount() }}</span>
  }
</button>

@if (panelOpen()) {
  <!-- Click-away closes it. Behind the panel in the stacking order, so it never
       swallows a click meant for a row. -->
  <div class="admin-panel-scrim" (click)="togglePanel()"></div>

  <div class="admin-notifs" role="dialog" aria-label="Approval decisions">
    <header class="admin-notifs-head">
      <strong>Approvals &amp; rejections</strong>
      <a [routerLink]="[basePath, 'decisions']" [queryParams]="{ status: 'Approved' }"
        (click)="togglePanel()">See all</a>
    </header>

    @if (!notifications().length) {
      <p class="admin-notifs-empty">Nothing has been decided yet.</p>
    } @else {
      <ul class="admin-notifs-list">
        @for (item of notifications(); track item.id) {
          <li>
            <button type="button" class="admin-notif"
              [class.is-unread]="item.isUnread"
              [attr.data-action]="item.action"
              (click)="open(item)">
              <span class="admin-notif-line">
                <span class="admin-notif-what">{{ headline(item) }}</span>
                <span class="admin-notif-amount">{{ item.amount | number: '1.2-2' }} ﷼</span>
              </span>

              <span class="admin-notif-project">
                {{ item.boqNumber }} · {{ item.projectName }}
              </span>

              <!-- Who decided, and whose work they decided on. Both, because the
                   panel is read by the approver, the author and the admin. -->
              <span class="admin-notif-who">
                by {{ item.actorName || 'somebody' }}
                @if (!item.isMine && item.preparedByName) {
                  · built by {{ item.preparedByName }}
                }
              </span>

              @if (item.reason) {
                <span class="admin-notif-reason">“{{ item.reason }}”</span>
              }

              <!-- How many times round this one has been. Silent on a clean
                   first-time approval, which is most of them. -->
              @if (attempts(item); as tally) {
                <span class="admin-notif-attempts">{{ tally }}</span>
              }

              <span class="admin-notif-when">{{ item.at | date: 'medium' }}</span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
}
