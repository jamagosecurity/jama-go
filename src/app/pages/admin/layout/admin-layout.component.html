<div class="admin-shell">
  <aside class="admin-sidebar" aria-label="Admin sidebar">
    <div class="admin-brand">
      <div class="admin-logo-badge">
        <img
          class="admin-logo"
          src="/JamaGoLogo-trim.png"
          alt="Jama Go"
          width="360"
          height="108"
        />
      </div>
    </div>

    <nav class="admin-nav" aria-label="Admin">
        <a routerLink="/admin/staff" routerLinkActive="active" class="nav-staff">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></svg>
          </span>
          <span>
            <strong>Staff</strong>
            <small>Team roster & visibility</small>
          </span>
        </a>

        <a routerLink="/admin/contacts" routerLinkActive="active" class="nav-contacts">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" /><path d="m22 6-10 7L2 6" /></svg>
          </span>
          <span>
            <strong>Contacts</strong>
            <small>Enquiry inbox</small>
          </span>
        </a>

        <a routerLink="/admin/dia" routerLinkActive="active" class="nav-dia">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M9 3h6l1 2h3v16H5V5h3z" />
              <path d="M9 12l2 2 4-4M9 18h6" />
            </svg>
          </span>
          <span>
            <strong>DIA Inspection</strong>
            <small>Quarterly schedules</small>
          </span>
        </a>

        <a routerLink="/" class="admin-nav-muted nav-site">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><path d="M9 22V12h6v10" /></svg>
          </span>
          <span>
            <strong>Public site</strong>
            <small>Open jamago.qa</small>
          </span>
        </a>
      </nav>

    <div class="admin-sidebar-foot">
      <div class="admin-user">
        <div class="admin-avatar" aria-hidden="true">{{ initials() }}</div>
        <div class="admin-user-meta">
          <p>{{ auth.currentUser()?.fullName || 'Administrator' }}</p>
          <small>{{ auth.currentUser()?.email }}</small>
        </div>
        <button type="button" class="btn-admin btn-admin-ghost signout" (click)="logout()">
          Sign out
        </button>
      </div>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <div>
          <p class="admin-topbar-kicker">{{ greeting() }}</p>
          <h1>{{ auth.currentUser()?.fullName || 'Administrator' }}</h1>
        </div>
      </div>
    </header>

    <div class="admin-content">
      <router-outlet />
    </div>
  </div>
</div>
