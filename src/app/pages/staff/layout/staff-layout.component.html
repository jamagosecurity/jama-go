<div class="staff-shell">
  <aside class="staff-sidebar" aria-label="Staff sidebar">
    <div class="staff-sidebar-head">
      <div class="staff-brand">
        <div class="staff-logo-badge">
          <img
            class="staff-logo"
            src="/JamaGoLogo-trim.png"
            alt="Jama Go"
            width="360"
            height="108"
          />
        </div>
        <div class="staff-brand-copy">
          <p class="staff-eyebrow">Staff Portal</p>
          <h2>Jama Go Staff</h2>
        </div>
      </div>
    </div>

    <!-- Only the work lives here now. Dashboard, profile, password and the
         public-site link were removed at the owner's request; their routes still
         exist and are reachable by URL. -->
    <nav class="staff-nav" aria-label="Staff">
      @if (canUploadDia()) {
        <a routerLink="/staff/dia" routerLinkActive="active">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M9 3h6l1 2h3v16H5V5h3z" />
              <path d="M9 12l2 2 4-4M9 18h6" />
            </svg>
          </span>
          <span>
            <strong>DIA Inspection</strong>
            <small>Create &amp; edit records</small>
          </span>
        </a>
      }

      @if (canBuildBoq()) {
        <a routerLink="/staff/storage" routerLinkActive="active">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="6" rx="2" />
              <rect x="3" y="14" width="18" height="6" rx="2" />
              <path d="M7 7h.01M7 17h.01" />
            </svg>
          </span>
          <span>
            <strong>Storage</strong>
            <small>Size the NVR array</small>
          </span>
        </a>
      }

      @if (canBuildBoq()) {
        <a routerLink="/staff/boq" routerLinkActive="active">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M9 3h6l1 2h3v16H5V5h3z" />
              <path d="M9 11h6M9 15h6M9 19h3" />
            </svg>
          </span>
          <span>
            <strong>Quotation</strong>
            <small>Priced from stock</small>
          </span>
        </a>
      }
    </nav>

    <div class="staff-sidebar-foot">
      <div class="staff-user">
        <div class="staff-avatar" aria-hidden="true">{{ initials() }}</div>
        <div class="staff-user-meta">
          <p>{{ auth.currentUser()?.fullName || 'Staff member' }}</p>
          <small>{{ auth.currentUser()?.email }}</small>
        </div>
        <button type="button" class="signout" (click)="logout()">Sign out</button>
      </div>
    </div>
  </aside>

  <div class="staff-main">
    <div class="staff-content">
      <router-outlet />
    </div>
  </div>
</div>
